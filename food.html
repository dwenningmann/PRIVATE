<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel • 105kg Performance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-sub: #f1f5f9;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;
            
            --kc-color: #ea580c;
            --kc-bg: #ffedd5;
            --pro-color: #059669;
            --pro-bg: #d1fae5;
            --carb-color: #2563eb;
            --carb-bg: #dbeafe;
            --fat-color: #7c3aed;
            --fat-bg: #ede9fe;
            
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.4;
            padding: 20px 16px;
            max-width: 640px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        header {
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-stat {
            font-size: 0.72rem;
            font-weight: 700;
            background: var(--pro-bg);
            color: var(--pro-color);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .header-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .progress-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-top: 14px;
            box-shadow: var(--shadow-sm);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar-bg {
            height: 8px;
            background: var(--surface-sub);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #059669);
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .segmented-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: var(--surface-sub);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 18px;
        }

        .seg-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 9px 0;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .seg-btn.active {
            background: var(--surface);
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        .days-scroll {
            overflow-x: auto;
            scrollbar-width: none;
            margin-bottom: 18px;
            padding-bottom: 2px;
        }

        .days-scroll::-webkit-scrollbar { display: none; }

        .days-container {
            display: flex;
            gap: 8px;
            width: max-content;
        }

        .day-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            min-width: 92px;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .day-chip.active {
            border-color: var(--text-main);
            color: var(--text-main);
            background: #ffffff;
            box-shadow: var(--shadow-md);
        }

        .day-chip .d-main { font-size: 0.85rem; font-weight: 700; display: block; }
        .day-chip .d-sub { font-size: 0.68rem; opacity: 0.8; margin-top: 2px; white-space: nowrap; }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .macro-card {
            border-radius: var(--radius-md);
            padding: 10px 4px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: var(--shadow-sm);
        }

        .macro-card.kc { background: var(--kc-bg); color: var(--kc-color); }
        .macro-card.pro { background: var(--pro-bg); color: var(--pro-color); }
        .macro-card.carb { background: var(--carb-bg); color: var(--carb-color); }
        .macro-card.fat { background: var(--fat-bg); color: var(--fat-color); }

        .macro-card .val { font-size: 1rem; font-weight: 800; letter-spacing: -0.3px; }
        .macro-card .lbl { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-top: 1px; opacity: 0.85; }

        .meals-stack { display: flex; flex-direction: column; gap: 12px; }

        .meal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .meal-card.completed {
            opacity: 0.5;
            background: var(--surface-sub);
            box-shadow: none;
        }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .meal-time-tag {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--surface-sub);
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }

        .meal-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .meal-macros {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 500;
        }

        .check-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid var(--border-hover);
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        .meal-card.completed .check-circle {
            background: var(--pro-color);
            border-color: var(--pro-color);
        }

        .check-circle svg {
            width: 14px;
            height: 14px;
            stroke: #ffffff;
            stroke-width: 3;
            fill: none;
            display: none;
        }

        .meal-card.completed .check-circle svg { display: block; }

        .ing-list {
            list-style: none;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
        }

        .ing-list li {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 5px;
            padding-left: 16px;
            position: relative;
        }

        .ing-list li::before {
            content: "•";
            color: var(--pro-color);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .note-tag {
            margin-top: 10px;
            font-size: 0.78rem;
            color: #854d0e;
            background: #fef9c3;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border-left: 3px solid #eab308;
            font-weight: 500;
        }

        .express-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: 700;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid #bfdbfe;
        }

        .cold-option {
            margin-top: 8px;
            padding: 8px 10px;
            background: var(--surface-sub);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--text-main);
            border: 1px dashed var(--border-hover);
        }

        .cold-option-title {
            font-weight: 700;
            color: #0284c7;
            display: block;
            margin-bottom: 2px;
            font-size: 0.72rem;
            text-transform: uppercase;
        }

        .shop-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

        .shop-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .shop-card h3 {
            font-size: 0.88rem;
            color: var(--text-main);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border);
            color: var(--text-muted);
        }

        .shop-row:last-child { border-bottom: none; }
        .shop-val { font-weight: 700; color: var(--text-main); }

        footer { text-align: center; margin-top: 40px; font-size: 0.75rem; color: var(--text-subtle); }
    </style>
</head>

                <button class="day-chip ${d.key === currentDay ? 'active' : ''}" onclick="setDay('${d.key}')">
                    <span class="d-main">${d.name}</span>
                    <span class="d-sub">${nutritionData[weekNum][d.key].sub}</span>
                </button>
            `).join('');
        }

        function renderMeals(weekNum, container) {
            const dayData = nutritionData[weekNum][currentDay];

            document.getElementById('mCal').innerText = dayData.macros.kcal;
            document.getElementById('mPro').innerText = `${dayData.macros.pro}g`;
            document.getElementById('mCarb').innerText = `${dayData.macros.carb}g`;
            document.getElementById('mFat').innerText = `${dayData.macros.fat}g`;

            const total = dayData.meals.length;
            let checked = 0;

            container.className = "meals-stack";
            container.innerHTML = dayData.meals.map((m, idx) => {
                const id = `w${weekNum}_${currentDay}_m${idx}`;
                const isDone = localStorage.getItem(id) === 'true';
                if (isDone) checked++;

                return `
                    <div class="meal-card ${isDone ? 'completed' : ''}">
                        <div class="meal-header">
                            <div>
                                <span class="meal-time-tag">⏱ ${m.time} Uhr</span>
                                <div class="meal-title">
                                    ${m.title}
                                    ${m.isExpress ? `<span class="express-badge">Supermarkt-Express</span>` : ''}
                                </div>
                                <div class="meal-macros">${m.macros}</div>
                            </div>
                            <div class="check-circle" onclick="toggle('${id}')">
                                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                        </div>
                        <ul class="ing-list">
                            ${m.ingredients.map(i => `<li>${i}</li>`).join('')}
                        </ul>
                        ${m.coldNote ? `<div class="cold-option"><span class="cold-option-title">Unterwegs-Tipp (Zero Equipment):</span>${m.coldNote}</div>` : ''}
                        ${m.note ? `<div class="note-tag">💡 ${m.note}</div>` : ''}
                    </div>
                `;
            }).join('');

            const pct = Math.round((checked / total) * 100);
            document.getElementById('pFill').style.width = `${pct}%`;
            document.getElementById('pText').innerText = `${pct}%`;
        }

        function renderShop(container) {
            container.className = "shop-grid";
            container.innerHTML = shoppingData.map(c => `
                <div class="shop-card">
                    <h3>${c.category}</h3>
                    ${c.items.map(i => `
                        <div class="shop-row">
                            <span>${i.name}</span>
                            <span class="shop-val">${i.qty}</span>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function toggle(id) {
            const val = localStorage.getItem(id) === 'true';
            localStorage.setItem(id, !val);
            render();
        }

        window.onload = init;
    </script>
</body>
</html>
